name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
      - 'Dockerfile'

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GO_VERSION: '1.26.x'
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Run tests
        working-directory: server
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.out
          retention-days: 5

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Run Gosec (SAST)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./server/...'

      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif

      - name: Dependency vulnerability scan
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ASG instance IDs
        id: get-instances
        run: |
          # Get the Auto Scaling Group name from infrastructure stack outputs
          ASG_NAME=$(aws cloudformation describe-stacks \
            --stack-name MulticaBackendStack-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendASGName`].OutputValue' \
            --output text)

          if [ -z "$ASG_NAME" ]; then
            echo "❌ Could not find ASG name from CloudFormation outputs"
            echo "Using fallback: environment variable or direct instance ID"
            echo "instance_ids=${{ secrets.EC2_INSTANCE_ID_DEV }}" >> $GITHUB_OUTPUT
          else
            # Get instance IDs from the Auto Scaling Group
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy` && LifecycleState==`InService`].InstanceId' \
              --output text | tr '\t' ',')

            echo "Found instances in ASG $ASG_NAME: $INSTANCE_IDS"
            echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to EC2 instances
        id: deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"

          if [ -z "$INSTANCE_IDS" ]; then
            echo "❌ No instances found for deployment"
            exit 1
          fi

          echo "🚀 Deploying to instances: $INSTANCE_IDS"

          # Deploy to each instance
          for instance_id in $(echo "$INSTANCE_IDS" | tr ',' ' '); do
            echo "Deploying to instance: $instance_id"

            aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "cd /opt/multica",
                "echo \"Pulling latest image...\"",
                "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
                "echo \"Stopping current container...\"",
                "docker stop multica-backend || true",
                "docker rm multica-backend || true",
                "echo \"Starting new container...\"",
                "docker run -d --name multica-backend \
                  --restart unless-stopped \
                  -p 8080:8080 \
                  --env-file /opt/multica/.env \
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
                "echo \"Deployment complete!\"",
                "docker ps | grep multica-backend"
              ]' \
              --output text

            echo "✅ Deployed to instance $instance_id"
          done

          # Get the load balancer URL from CloudFormation outputs
          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name MulticaBackendStack-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendURL`].OutputValue' \
            --output text || echo "https://dev-api.multica.example.com")

          echo "app-url=$ALB_URL" >> $GITHUB_OUTPUT

      - name: Health check
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          echo "🔍 Running health check against: $APP_URL"

          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null "$APP_URL/health"; then
              echo "✅ Health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
          curl -f https://dev-api.multica.example.com/health
          echo "✅ Smoke tests passed"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ASG instance IDs
        id: get-instances
        run: |
          ASG_NAME=$(aws cloudformation describe-stacks \
            --stack-name MulticaBackendStack-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendASGName`].OutputValue' \
            --output text)

          if [ -z "$ASG_NAME" ]; then
            echo "instance_ids=${{ secrets.EC2_INSTANCE_ID_STAGING }}" >> $GITHUB_OUTPUT
          else
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy` && LifecycleState==`InService`].InstanceId' \
              --output text | tr '\t' ',')
            echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to EC2 instances
        id: deploy
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"

          for instance_id in $(echo "$INSTANCE_IDS" | tr ',' ' '); do
            aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "cd /opt/multica",
                "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
                "docker stop multica-backend || true",
                "docker rm multica-backend || true",
                "docker run -d --name multica-backend \
                  --restart unless-stopped \
                  -p 8080:8080 \
                  --env-file /opt/multica/.env \
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
              ]' \
              --output text
          done

          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name MulticaBackendStack-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendURL`].OutputValue' \
            --output text || echo "https://staging-api.multica.example.com")

          echo "app-url=$ALB_URL" >> $GITHUB_OUTPUT

      - name: Health check
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null "$APP_URL/health"; then
              echo "✅ Health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ASG information
        id: get-asg
        run: |
          ASG_NAME=$(aws cloudformation describe-stacks \
            --stack-name MulticaBackendStack-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendASGName`].OutputValue' \
            --output text)

          if [ -z "$ASG_NAME" ]; then
            echo "⚠️  Using fallback instance IDs from secrets"
            echo "instance_ids=${{ secrets.EC2_INSTANCE_IDS_PROD }}" >> $GITHUB_OUTPUT
            echo "asg_name=" >> $GITHUB_OUTPUT
          else
            echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT

            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy` && LifecycleState==`InService`].InstanceId' \
              --output text | tr '\t' ',')

            echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          fi

          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name MulticaBackendStack-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendURL`].OutputValue' \
            --output text || echo "https://api.multica.example.com")

          echo "alb_url=$ALB_URL" >> $GITHUB_OUTPUT

      - name: Create backup
        run: |
          echo "Creating backup before production deployment..."
          # Database backup would be handled by RDS automated backups
          # Create a manual snapshot for extra safety
          timestamp=$(date +%Y%m%d-%H%M%S)
          echo "Backup timestamp: $timestamp"

      - name: Deploy to instances (Rolling deployment)
        id: deploy
        env:
          ALB_URL: ${{ steps.get-asg.outputs.alb_url }}
        run: |
          INSTANCE_IDS="${{ steps.get-asg.outputs.instance_ids }}"
          echo "🚀 Starting rolling deployment to production instances"

          # Deploy to instances one at a time for zero-downtime
          for instance_id in $(echo "$INSTANCE_IDS" | tr ',' ' '); do
            echo "Deploying to instance: $instance_id"

            aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "cd /opt/multica",
                "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
                "docker stop multica-backend || true",
                "docker rm multica-backend || true",
                "docker run -d --name multica-backend \
                  --restart unless-stopped \
                  -p 8080:8080 \
                  --env-file /opt/multica/.env \
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
              ]' \
              --output text

            # Wait for health check before continuing to next instance
            echo "⏳ Waiting for instance $instance_id to become healthy..."
            sleep 30

            if ! curl -f -s -o /dev/null "$ALB_URL/health"; then
              echo "❌ Health check failed after deploying to instance $instance_id"
              exit 1
            fi

            echo "✅ Instance $instance_id deployed successfully"
          done

          echo "app-url=$ALB_URL" >> $GITHUB_OUTPUT

      - name: Final health check
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          max_attempts=10
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null "$APP_URL/health"; then
              echo "✅ Production health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Run production smoke tests
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          echo "Running production smoke tests..."
          curl -f "$APP_URL/health"
          # Add more production smoke tests
          echo "✅ Production smoke tests passed"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Trigger rollback
        run: |
          echo "⚠️  Deployment failed. Triggering rollback procedures..."
          # Add rollback logic here
          # Could involve:
          # - Reverting to previous Docker image
          # - Restoring database backup
          # - Notifying team
