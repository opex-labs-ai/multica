name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'Dockerfile.web'

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Dependency vulnerability audit
        run: pnpm audit --prod

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --production || true
          npm audit fix --dry-run

  build:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID_DEV }}
          API_URL: ${{ secrets.DEV_API_URL }}
          WS_URL: ${{ secrets.DEV_WS_URL }}
        run: |
          # Deploy frontend container to EC2
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/multica",
              "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "docker stop multica-web || true",
              "docker rm multica-web || true",
              "docker run -d --name multica-web \
                --restart unless-stopped \
                -p 3000:3000 \
                -e NEXT_PUBLIC_API_URL=${{ env.API_URL }} \
                -e NEXT_PUBLIC_WS_URL=${{ env.WS_URL }} \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            ]' \
            --output text

          echo "app-url=https://dev.multica.example.com" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null https://dev.multica.example.com; then
              echo "✅ Health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Test that the app loads
          response=$(curl -s -o /dev/null -w "%{http_code}" https://dev.multica.example.com)
          if [ "$response" = "200" ]; then
            echo "✅ App is accessible"
          else
            echo "❌ App returned HTTP $response"
            exit 1
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID_STAGING }}
          API_URL: ${{ secrets.STAGING_API_URL }}
          WS_URL: ${{ secrets.STAGING_WS_URL }}
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/multica",
              "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "docker stop multica-web || true",
              "docker rm multica-web || true",
              "docker run -d --name multica-web \
                --restart unless-stopped \
                -p 3000:3000 \
                -e NEXT_PUBLIC_API_URL=${{ env.API_URL }} \
                -e NEXT_PUBLIC_WS_URL=${{ env.WS_URL }} \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            ]' \
            --output text

          echo "app-url=https://staging.multica.example.com" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null https://staging.multica.example.com; then
              echo "✅ Health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create backup
        run: |
          echo "Creating backup before production deployment..."
          # Add backup commands here

      - name: Deploy to production (Rolling deployment)
        id: deploy
        env:
          INSTANCE_IDS: ${{ secrets.EC2_INSTANCE_IDS_PROD }}
          API_URL: ${{ secrets.PROD_API_URL }}
          WS_URL: ${{ secrets.PROD_WS_URL }}
        run: |
          # Deploy to instances one at a time for zero-downtime
          for instance_id in $(echo "$INSTANCE_IDS" | tr ',' ' '); do
            echo "Deploying to instance: $instance_id"

            aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "cd /opt/multica",
                "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
                "docker stop multica-web || true",
                "docker rm multica-web || true",
                "docker run -d --name multica-web \
                  --restart unless-stopped \
                  -p 3000:3000 \
                  -e NEXT_PUBLIC_API_URL=${{ env.API_URL }} \
                  -e NEXT_PUBLIC_WS_URL=${{ env.WS_URL }} \
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
              ]' \
              --output text

            # Wait for health check before continuing to next instance
            sleep 30
            if ! curl -f -s -o /dev/null https://multica.example.com; then
              echo "❌ Health check failed for instance $instance_id"
              exit 1
            fi
          done

          echo "app-url=https://multica.example.com" >> $GITHUB_OUTPUT

      - name: Final health check
        run: |
          max_attempts=10
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null https://multica.example.com; then
              echo "✅ Production health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://multica.example.com)
          if [ "$response" = "200" ]; then
            echo "✅ Production app is accessible"
          else
            echo "❌ Production app returned HTTP $response"
            exit 1
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Trigger rollback
        run: |
          echo "⚠️  Deployment failed. Triggering rollback procedures..."
          # Add rollback logic here
          # Could involve:
          # - Reverting to previous Docker image
          # - Rolling back CDN cache
          # - Notifying team
