name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'Dockerfile.web'

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Dependency vulnerability audit
        run: pnpm audit --prod

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --production || true
          npm audit fix --dry-run

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        env:
          # These will be overridden per environment during deployment
          NEXT_PUBLIC_API_URL: placeholder
          NEXT_PUBLIC_WS_URL: placeholder
        run: |
          echo "Building Next.js application..."
          pnpm --filter @multica/web build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: apps/web/.next
          retention-days: 7

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: apps/web/.next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          S3_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)

          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomain`].OutputValue' \
            --output text)

          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.DEV_WS_URL }}
        run: |
          echo "Building Next.js app with environment-specific configuration..."
          pnpm --filter @multica/web build

      - name: Export static site
        run: |
          pnpm --filter @multica/web export
          # Next.js exports to 'out' directory by default
          ls -la apps/web/out

      - name: Deploy to S3
        id: deploy
        env:
          S3_BUCKET: ${{ steps.infra.outputs.s3_bucket }}
          CLOUDFRONT_URL: ${{ steps.infra.outputs.cloudfront_url }}
        run: |
          echo "🚀 Deploying to S3 bucket: $S3_BUCKET"

          # Sync files to S3
          aws s3 sync apps/web/out/ s3://$S3_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js"

          # Upload HTML files with shorter cache
          aws s3 sync apps/web/out/ s3://$S3_BUCKET/ \
            --exclude "*" \
            --include "*.html" \
            --include "service-worker.js" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Files uploaded to S3"
          echo "app-url=https://$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.infra.outputs.distribution_id }}
        run: |
          echo "🔄 Invalidating CloudFront cache for distribution: $DISTRIBUTION_ID"

          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

          echo "✅ CloudFront cache invalidation created"

      - name: Health check
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          echo "🔍 Running health check against: $APP_URL"

          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null "$APP_URL"; then
              echo "✅ Health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Run smoke tests
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          echo "Running smoke tests..."
          response=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          if [ "$response" = "200" ]; then
            echo "✅ App is accessible"
          else
            echo "❌ App returned HTTP $response"
            exit 1
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: apps/web/.next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          S3_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)

          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomain`].OutputValue' \
            --output text)

          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.STAGING_WS_URL }}
        run: pnpm --filter @multica/web build

      - name: Export static site
        run: pnpm --filter @multica/web export

      - name: Deploy to S3
        id: deploy
        env:
          S3_BUCKET: ${{ steps.infra.outputs.s3_bucket }}
          CLOUDFRONT_URL: ${{ steps.infra.outputs.cloudfront_url }}
        run: |
          aws s3 sync apps/web/out/ s3://$S3_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js"

          aws s3 sync apps/web/out/ s3://$S3_BUCKET/ \
            --exclude "*" \
            --include "*.html" \
            --include "service-worker.js" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "app-url=https://$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.infra.outputs.distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

      - name: Health check
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null "$APP_URL"; then
              echo "✅ Health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for deployment... (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: apps/web/.next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          S3_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)

          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name MulticaFrontendStack-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomain`].OutputValue' \
            --output text)

          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Create backup
        env:
          S3_BUCKET: ${{ steps.infra.outputs.s3_bucket }}
        run: |
          echo "Creating backup of current S3 content..."
          timestamp=$(date +%Y%m%d-%H%M%S)
          echo "Backup timestamp: $timestamp"
          # S3 versioning handles backups automatically

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.PROD_WS_URL }}
        run: |
          echo "🏗️  Building production frontend..."
          pnpm --filter @multica/web build

      - name: Export static site
        run: |
          echo "📦 Exporting static site..."
          pnpm --filter @multica/web export

      - name: Deploy to S3
        id: deploy
        env:
          S3_BUCKET: ${{ steps.infra.outputs.s3_bucket }}
          CLOUDFRONT_URL: ${{ steps.infra.outputs.cloudfront_url }}
        run: |
          echo "🚀 Deploying to production S3 bucket: $S3_BUCKET"

          # Upload with long cache for static assets
          aws s3 sync apps/web/out/ s3://$S3_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js"

          # Upload HTML files with no cache
          aws s3 sync apps/web/out/ s3://$S3_BUCKET/ \
            --exclude "*" \
            --include "*.html" \
            --include "service-worker.js" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Files uploaded to S3"
          echo "app-url=https://$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.infra.outputs.distribution_id }}
        run: |
          echo "🔄 Invalidating CloudFront cache..."

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation created: $INVALIDATION_ID"
          echo "✅ CloudFront cache invalidation in progress"

      - name: Wait for CloudFront invalidation
        env:
          DISTRIBUTION_ID: ${{ steps.infra.outputs.distribution_id }}
        run: |
          echo "⏳ Waiting for CloudFront invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id $DISTRIBUTION_ID \
            --id $(aws cloudfront list-invalidations \
              --distribution-id $DISTRIBUTION_ID \
              --query 'InvalidationList.Items[0].Id' \
              --output text)
          echo "✅ CloudFront cache invalidated"

      - name: Final health check
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          max_attempts=10
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if curl -f -s -o /dev/null "$APP_URL"; then
              echo "✅ Production health check passed"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Run production smoke tests
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          echo "Running production smoke tests..."
          response=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          if [ "$response" = "200" ]; then
            echo "✅ Production app is accessible"
          else
            echo "❌ Production app returned HTTP $response"
            exit 1
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Trigger rollback
        run: |
          echo "⚠️  Deployment failed. Triggering rollback procedures..."
          # Add rollback logic here
          # Could involve:
          # - Reverting to previous Docker image
          # - Rolling back CDN cache
          # - Notifying team
