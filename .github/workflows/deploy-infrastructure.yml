name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: 'CDK action'
        required: true
        type: choice
        default: 'deploy'
        options:
          - diff
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy Infrastructure to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Build CDK project
        working-directory: ./infrastructure
        run: npm run build

      - name: CDK Bootstrap (if needed)
        if: inputs.action == 'deploy'
        working-directory: ./infrastructure
        run: |
          # Check if the environment is already bootstrapped
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Bootstrapping CDK environment..."
            cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
          else
            echo "CDK environment already bootstrapped"
          fi

      - name: CDK Synth
        working-directory: ./infrastructure
        run: cdk synth --context environment=${{ inputs.environment }}

      - name: CDK Diff
        if: inputs.action == 'diff'
        working-directory: ./infrastructure
        run: cdk diff --all --context environment=${{ inputs.environment }}

      - name: CDK Deploy
        if: inputs.action == 'deploy'
        working-directory: ./infrastructure
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "🚀 Deploying infrastructure to $ENVIRONMENT environment"

          # Deploy all stacks with environment context
          cdk deploy --all \
            --context environment=$ENVIRONMENT \
            --require-approval never \
            --outputs-file outputs.json

          echo "✅ Deployment complete!"

      - name: CDK Destroy
        if: inputs.action == 'destroy' && inputs.environment != 'production'
        working-directory: ./infrastructure
        run: |
          echo "⚠️  Destroying infrastructure for ${{ inputs.environment }} environment"
          cdk destroy --all \
            --context environment=${{ inputs.environment }} \
            --force

      - name: Display infrastructure outputs
        if: inputs.action == 'deploy'
        working-directory: ./infrastructure
        run: |
          echo "📋 Infrastructure Outputs:"
          echo "========================"
          if [ -f outputs.json ]; then
            cat outputs.json | jq '.' || cat outputs.json
          else
            echo "No outputs file generated"
          fi

      - name: Upload infrastructure outputs
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-outputs-${{ inputs.environment }}
          path: infrastructure/outputs.json
          retention-days: 30
          if-no-files-found: warn

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Infrastructure deployment to ${{ inputs.environment }} completed successfully"
          else
            echo "❌ Infrastructure deployment to ${{ inputs.environment }} failed"
            exit 1
          fi
