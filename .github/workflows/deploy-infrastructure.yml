name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: 'CDK action'
        required: true
        type: choice
        default: 'deploy'
        options:
          - diff
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy Infrastructure to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      # Note: This is a template workflow. When CDK infrastructure is added:
      # 1. Update the working-directory to point to your CDK code location
      # 2. Uncomment and configure the installation and build steps
      # 3. Add required GitHub Secrets for your infrastructure

      # - name: Install CDK dependencies
      #   working-directory: ./infrastructure
      #   run: npm ci

      # - name: CDK Bootstrap (if needed)
      #   if: inputs.environment == 'dev'
