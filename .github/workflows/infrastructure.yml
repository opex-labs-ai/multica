name: Infrastructure

# The agent runtime stack (infrastructure/). Validation runs on every change to
# it; deploying is a manual dispatch, because the thing it replaces is the
# machine the team's agents are currently running on.
#
# ci.yml does not cover this path: its frontend jobs typecheck the workspace,
# but `cdk synth` and the template assertions belong with the stack rather than
# in a job every frontend change pays for.
on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "diff shows what would change; deploy applies it; recover clears a stack stuck in UPDATE_ROLLBACK_FAILED"
        type: choice
        default: diff
        options: [diff, deploy, recover]
      stack:
        description: "Which stack to act on"
        type: choice
        default: Multica-AgentRuntime
        options: [Multica-AgentRuntime, Multica-SelfHost]
      allowed_emails:
        description: "Multica-SelfHost only: comma-separated addresses allowed to sign up"
        type: string
        default: ""
      resources_to_skip:
        description: "recover only: space-separated logical ids CloudFormation may give up on, e.g. ApplyBootstrap"
        type: string
        default: ""
      confirm_security_changes:
        description: "I have read the diff and accept its IAM and security group changes (every first deploy of a stack has them)"
        type: boolean
        default: false
      extra_context:
        description: "Further CDK context, e.g. -c vpcId=vpc-0123abc -c subnetId=subnet-0123abc -c availabilityZone=ap-south-1a -c elasticIp=false"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The script is embedded verbatim in the instance's user data, so a syntax
      # error here is a machine that half-configures itself and never reports a
      # failure anywhere a deploy can see.
      - name: Check shell scripts
        working-directory: infrastructure
        run: |
          for script in assets/bootstrap.sh scripts/*.sh; do
            bash -n "$script"
          done

      - name: Typecheck
        run: pnpm --filter @multica/infrastructure typecheck

      - name: Test
        run: pnpm --filter @multica/infrastructure test

      # No AWS credentials: the app leaves account and region unset when they
      # are absent, so the templates synthesize region-agnostic. The self-host
      # stack is behind a context flag and needs its signup allowlist, so it
      # gets its own invocation rather than going unsynthesized.
      - name: Synth
        run: pnpm --filter @multica/infrastructure synth

      - name: Synth the self-host stack
        working-directory: infrastructure
        run: pnpm exec cdk synth Multica-SelfHost -c selfHost=true -c allowedEmails=ci@example.com --quiet

  # Needs an OIDC role in the target account (secret AWS_DEPLOY_ROLE_ARN), the
  # AWS_REGION variable, and a GitHub environment named aws-agent-runtime. Put
  # required reviewers on that environment: an agent-runtime deploy replaces the
  # instance whenever the bootstrap script changed, which kills any run in flight
  # on it, and a self-host deploy restarts the server.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-agent-runtime
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: multica-infrastructure-${{ github.run_id }}

      # A stack in UPDATE_ROLLBACK_FAILED refuses every update, and only
      # ContinueUpdateRollback clears it. The OIDC role cannot call
      # CloudFormation itself, but it can assume CDK's deploy role, which is how
      # `cdk deploy` reaches CloudFormation at all — and that role's
      # DeployPermissions statement carries ContinueUpdateRollback on every
      # stack. So recovery needs no credential this workflow does not already
      # hold.
      - name: Continue the rollback
        if: inputs.action == 'recover'
        env:
          STACK: ${{ inputs.stack }}
          SKIP: ${{ inputs.resources_to_skip }}
          REGION: ${{ vars.AWS_REGION }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          role="arn:aws:iam::${account}:role/cdk-hnb659fds-deploy-role-${account}-${REGION}"
          echo "Assuming ${role}"
          creds="$(aws sts assume-role --role-arn "${role}" --role-session-name "multica-recover-${RUN_ID}" --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          AWS_ACCESS_KEY_ID="$(printf '%s' "${creds}" | cut -f1)"
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "${creds}" | cut -f2)"
          AWS_SESSION_TOKEN="$(printf '%s' "${creds}" | cut -f3)"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          if [ -n "${SKIP}" ]; then
            aws cloudformation continue-update-rollback --stack-name "${STACK}" --resources-to-skip ${SKIP}
          else
            aws cloudformation continue-update-rollback --stack-name "${STACK}"
          fi
          # There is no waiter for an update rollback: stack-rollback-complete
          # waits on ROLLBACK_COMPLETE, which is a failed create, not this.
          status=UPDATE_ROLLBACK_IN_PROGRESS
          for _ in $(seq 1 60); do
            status="$(aws cloudformation describe-stacks --stack-name "${STACK}" --query 'Stacks[0].StackStatus' --output text)"
            case "${status}" in
              *_IN_PROGRESS) sleep 15 ;;
              *) break ;;
            esac
          done
          echo "${STACK} is ${status}"
          test "${status}" = UPDATE_ROLLBACK_COMPLETE

      # Multica-SelfHost needs its signup allowlist, which is not committed: port
      # 443 is open to the internet, so an empty allowlist would let anyone who
      # finds the URL create an account. The agent runtime's daemon id is pinned
      # in cdk.json and needs nothing here.
      - name: Resolve stack context
        id: context
        if: inputs.action != 'recover'
        env:
          STACK: ${{ inputs.stack }}
          ALLOWED_EMAILS: ${{ inputs.allowed_emails }}
          EXTRA: ${{ inputs.extra_context }}
        run: |
          if [ "$STACK" = "Multica-SelfHost" ]; then
            if [ -z "$ALLOWED_EMAILS" ]; then
              echo "::error::allowed_emails is required for Multica-SelfHost: port 443 is open to the internet, so without an allowlist anyone who finds the URL can sign up."
              exit 1
            fi
            echo "args=-c selfHost=true -c allowedEmails=$ALLOWED_EMAILS $EXTRA" >> "$GITHUB_OUTPUT"
          else
            echo "args=$EXTRA" >> "$GITHUB_OUTPUT"
          fi

      # Only for a diff run: `cdk deploy` prints the same change set itself.
      - name: Diff
        if: inputs.action == 'diff'
        working-directory: infrastructure
        run: pnpm exec cdk diff ${{ inputs.stack }} ${{ steps.context.outputs.args }}

      # CDK's own approval prompt cannot work here: it wants a TTY, and a runner
      # has none, so `broadening` turns every IAM or security-group change into
      # a failed job rather than a question. That is not a gate, because the
      # first deploy of any stack creates both — it simply means the stack can
      # never be created from CI.
      #
      # The confirmation moves to the dispatch form instead. Run `diff` first,
      # read the IAM and security-group tables it prints, then dispatch
      # `deploy` with the box ticked. Unticked, CDK still refuses anything
      # security-sensitive, so a careless deploy of a changed policy stops.
      - name: Deploy
        if: inputs.action == 'deploy'
        working-directory: infrastructure
        run: |
          pnpm exec cdk deploy ${{ inputs.stack }} ${{ steps.context.outputs.args }} \
            --require-approval ${{ inputs.confirm_security_changes && 'never' || 'broadening' }} \
            --progress events
